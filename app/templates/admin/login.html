{% extends "base.html" %}
{% block title %}Acceso administrativo | SabanaPasajes{% endblock %}
{% block content %}<section class="card login-card"><p class="eyebrow">ACCESO RESTRINGIDO</p><h1>Administración</h1><p>Después de tres intentos fallidos, la cuenta se bloquea durante 15 minutos.</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post"><label>Usuario<input name="username" required maxlength="50" autocomplete="username"></label><label>Contraseña<input type="password" name="password" required maxlength="256" autocomplete="current-password"></label><button class="button" type="submit">Ingresar</button></form></section>{% endblock %}
